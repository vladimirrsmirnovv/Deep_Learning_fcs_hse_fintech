name: Check CLIP HW

on: [push]

jobs:
  start-runner-internal:
    uses: fintech-dl-hse/checkhw/.github/workflows/start-runner.yaml@main

  run_autograding:
    needs: [ "start-runner-internal" ]
    concurrency:
      group: ${{ github.repository }}
      cancel-in-progress: true
    name: Autograding
    runs-on: self-hosted-cpu
    outputs:
      summary: ${{ steps.autograding.output.Points }}
    steps:
      - name: Checkout HW
        uses: fintech-dl-hse/action-checkout-hw@main
        with:
          autograding-file: autograding-clip.json

      - name: Extract compute_clip_logits and clip_loss
        run: /data/bin/miniconda3/envs/jupyter-actions/bin/python scripts/extract_class_from_notebook.py --notebook "hw_clip.ipynb" --class_definition "compute_clip_logits" --out_filename "clip_modeling.py"

      - name: Autograding
        id: autograding
        uses: education/autograding@v1

      - name: Print outputs
        env:
          MYOUTPUT: ${{ steps.autograding.outputs.Points }}
        run: echo ${MYOUTPUT}

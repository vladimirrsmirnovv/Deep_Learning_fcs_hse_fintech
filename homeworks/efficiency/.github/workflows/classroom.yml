name: Check HW Efficiency

on: [push]

jobs:
  start-runner-internal:
    uses: fintech-dl-hse/checkhw/.github/workflows/start-gpu-runner.yaml@main

  run_autograding:
    needs: [ "start-runner-internal" ]
    name: Autograding
    runs-on: self-hosted-gpu
    concurrency:
      group: ${{ github.repository }}
      cancel-in-progress: true
    steps:
      - name: Nvidia SMI
        run: nvidia-smi

      - name: Checkout HW
        uses: fintech-dl-hse/action-checkout-hw@main
        with:
          autograding-file: autograding-efficiency.json

      - name: Autograding
        uses: education/autograding@v1

